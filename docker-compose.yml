services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trialguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trialguard}
      POSTGRES_DB: trialguard
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trialguard"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://trialguard:${POSTGRES_PASSWORD:-trialguard}@db:5432/trialguard
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --proxy-headers"

volumes:
  pgdata:
